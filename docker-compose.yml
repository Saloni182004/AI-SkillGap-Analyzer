services:
  # ==========================================
  # NODE.JS SERVICES (Node v25.2.1)
  # ==========================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node api-gateway/server.js
    ports:
      - "${GATEWAY_PORT:-5000}:${GATEWAY_PORT:-5000}"
    environment:
      - PORT=${GATEWAY_PORT:-5000}
      - GATEWAY_PORT=${GATEWAY_PORT:-5000} 
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:${AUTH_SERVICE_PORT:-5001}
      - ROADMAP_SERVICE_URL=http://roadmap-service:${ROADMAP_SERVICE_PORT:-5004}
      - INTERVIEW_SERVICE_URL=http://interview-service:${INTERVIEW_SERVICE_PORT:-5005}
      - RESUME_SERVICE_URL=http://resume-service:${RESUME_SERVICE_PORT:-5002}
      - AI_ORCHESTRATOR_URL=${COLAB_AI_URL}
    depends_on:
      - auth-service
      - roadmap-service

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node services/auth-service/server.js
    ports:
      - "${AUTH_SERVICE_PORT:-5001}:${AUTH_SERVICE_PORT:-5001}"
    environment:
      - PORT=${AUTH_SERVICE_PORT:-5001}
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT:-5001} # <-- Added explicit mapping
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}

  roadmap-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node services/RoadmapGenerator/server.js
    ports:
      - "${ROADMAP_SERVICE_PORT:-5004}:${ROADMAP_SERVICE_PORT:-5004}"
    environment:
      - PORT=${ROADMAP_SERVICE_PORT:-5004}
      - ROADMAP_SERVICE_PORT=${ROADMAP_SERVICE_PORT:-5004} # <-- Added explicit mapping
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_URI=${MONGO_URI}
      - AI_ORCHESTRATOR_URL=http://ai-orchestrator:5003

  interview-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node services/InterviewService/server.js
    ports:
      - "${INTERVIEW_SERVICE_PORT:-5005}:${INTERVIEW_SERVICE_PORT:-5005}"
    environment:
      - PORT=${INTERVIEW_SERVICE_PORT:-5005}
      - INTERVIEW_SERVICE_PORT=${INTERVIEW_SERVICE_PORT:-5005} # <-- Added explicit mapping
      - MONGO_URI=${MONGO_URI} 
      - AI_ORCHESTRATOR_URL=http://ai-orchestrator:5003
      - ROADMAP_SERVICE_URL=http://roadmap-service:${ROADMAP_SERVICE_PORT:-5004}
      - RESUME_SERVICE_URL=http://resume-service:${RESUME_SERVICE_PORT:-5002}

  # ==========================================
  # PYTHON FASTAPI SERVICES (Python 3.11.5)
  # ==========================================
  ai-orchestrator:
    build:
      context: ./backend/services/AiOrchestrator
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port ${AI_ORCHESTRATOR_SERVICE_PORT:-5003}
    ports:
      - "${AI_ORCHESTRATOR_SERVICE_PORT:-5003}:${AI_ORCHESTRATOR_SERVICE_PORT:-5003}"
    environment:
      - COLAB_AI_URL=${COLAB_AI_URL}

  resume-service:
    build:
      context: ./backend/services/ResumeService
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port ${RESUME_SERVICE_PORT:-5002}
    ports:
      - "${RESUME_SERVICE_PORT:-5002}:${RESUME_SERVICE_PORT:-5002}"
    environment:
      - MONGO_URI=${MONGO_URI}
      - AI_ORCHESTRATOR_URL_EXTRACT_PROFILE=${AI_ORCHESTRATOR_URL_EXTRACT_PROFILE}

  # ==========================================
  # FRONTEND (React/Vite)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api-gateway